name: Generate number-pair video

on:
  workflow_dispatch:
    inputs:
      video_count:
        description: Number of videos
        required: false
        default: "1"
      seed:
        description: Optional base seed
        required: false
        default: ""
      yt_privacy_status:
        description: YouTube privacy status
        required: false
        default: "private"

permissions:
  contents: write

concurrency:
  group: number-pair-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PRIVATE_REPO: "aisenbergdarfus97225-eng/tim-3-diem-khac"
      PRIVATE_REF: "main"
      PYTHONUNBUFFERED: "1"
      RUNNER_CONTROL_DIR: "${{ github.workspace }}/runner-control"
      VIDEO_COUNT: "${{ github.event.inputs.video_count || '1' }}"
      VIDEO_SEED: "${{ github.event.inputs.seed || '' }}"
      YT_PRIVACY_STATUS: "${{ github.event.inputs.yt_privacy_status || 'private' }}"
      YT_UPLOAD_ENABLED: "${{ secrets.YT_UPLOAD_ENABLED || 'true' }}"

    steps:
      - name: Checkout public control repo
        uses: actions/checkout@v4
        with:
          path: runner-control
          fetch-depth: 0

      - name: Check private checkout token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "::error::Add PRIVATE_REPO_TOKEN to the public repository secrets."
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true

      - name: Select next public title
        working-directory: .
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path

          control = Path("runner-control")
          catalog = control / "extra-titles.txt"
          usage = control / "title-usage.txt"
          titles = [
              line.strip()
              for line in catalog.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          used = {
              line.strip()
              for line in usage.read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          start = 1
          selected = next(
              ((idx, title) for idx, title in enumerate(titles[start - 1:], start)
               if title not in used),
              None,
          )
          if selected is None:
              raise SystemExit("No unused public title remains.")
          idx, title = selected
          Path("private-source/tieude.txt").write_text(title + "\n", encoding="utf-8")
          (control / ".selected-title.txt").write_text(title + "\n", encoding="utf-8")
          print(f"[title] index={idx}/{len(titles)}")
          print(f"[title] {title}")
          PYCODE

      - name: Use public YouTube description
        run: cp runner-control/mota.txt private-source/mota.txt

      - name: Validate number-pair private source
        run: |
          cd private-source
          test -f generate_video.py
          test -f puzzle_engine.py
          test -f video_renderer.py
          test -f config.json
          test -f requirements.txt
          test -f history/puzzles.jsonl
          test -f history/videos.jsonl
          test -f assets/fonts/ipaexg.ttf
          test -f assets/mascot/fox-sheet.webp
          test -f images/videonen.mp4
          for i in $(seq 1 10); do test -f "music/$i.mp3"; done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        working-directory: private-source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install requests

      - name: Validate project
        working-directory: private-source
        run: python tools/check_project.py

      - name: Generate number-pair videos
        working-directory: private-source
        run: |
          if [ -n "$VIDEO_SEED" ]; then
            python generate_video.py --videos "$VIDEO_COUNT" --seed "$VIDEO_SEED"
          else
            python generate_video.py --videos "$VIDEO_COUNT"
          fi

      - name: Upload videos to YouTube
        if: env.YT_UPLOAD_ENABLED == 'true'
        working-directory: private-source
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import requests

          client_id = os.environ["YT_CLIENT_ID"].strip()
          client_secret = os.environ["YT_CLIENT_SECRET"].strip()
          refresh = os.environ["YT_REFRESH_TOKEN"].strip()
          if not all((client_id, client_secret, refresh)):
              raise SystemExit("Missing YouTube OAuth secrets")

          token = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh,
                  "grant_type": "refresh_token",
              },
              timeout=60,
          )
          token.raise_for_status()
          access_token = token.json()["access_token"]
          headers = {"Authorization": f"Bearer {access_token}"}

          for manifest in sorted(Path("dist").glob("numbers-pair-*.json")):
              data = json.loads(manifest.read_text(encoding="utf-8"))
              video = manifest.with_suffix(".mp4")
              thumbnail = manifest.with_name(manifest.stem + "-thumbnail.jpg")
              metadata = {
                  "snippet": {
                      "title": str(data["title"])[:100],
                      "description": Path("mota.txt").read_text(encoding="utf-8")[:5000],
                      "categoryId": "24",
                  },
                  "status": {
                      "privacyStatus": os.environ["YT_PRIVACY_STATUS"],
                      "selfDeclaredMadeForKids": False,
                  },
              }
              init = requests.post(
                  "https://www.googleapis.com/upload/youtube/v3/videos",
                  params={"uploadType": "resumable", "part": "snippet,status"},
                  headers={
                      **headers,
                      "Content-Type": "application/json; charset=UTF-8",
                      "X-Upload-Content-Type": "video/mp4",
                      "X-Upload-Content-Length": str(video.stat().st_size),
                  },
                  json=metadata,
                  timeout=60,
              )
              init.raise_for_status()
              location = init.headers["Location"]
              with video.open("rb") as handle:
                  upload = requests.put(
                      location,
                      headers={"Content-Type": "video/mp4", "Content-Length": str(video.stat().st_size)},
                      data=handle,
                      timeout=3600,
                  )
              upload.raise_for_status()
              video_id = upload.json()["id"]
              with thumbnail.open("rb") as handle:
                  thumb = requests.post(
                      "https://www.googleapis.com/upload/youtube/v3/thumbnails/set",
                      params={"videoId": video_id, "uploadType": "multipart"},
                      headers=headers,
                      files={"media": ("thumbnail.jpg", handle, "image/jpeg")},
                      timeout=180,
                  )
              thumb.raise_for_status()
              print(f"[youtube] https://youtu.be/{video_id}")
          PYCODE

      - name: Commit private generation history
        working-directory: private-source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/puzzles.jsonl history/videos.jsonl
          if git diff --cached --quiet; then
            echo "No private history changes."
            exit 0
          fi
          git commit -m "Update number-pair generation history [skip ci]"
          git push origin HEAD:main

      - name: Commit used public title
        working-directory: runner-control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          selected_title="$(cat .selected-title.txt)"
          grep -Fxq "$selected_title" title-usage.txt || printf '%s\n' "$selected_title" >> title-usage.txt
          rm -f .selected-title.txt
          git add title-usage.txt
          if git diff --cached --quiet; then
            echo "No public title usage change."
            exit 0
          fi
          git commit -m "Update used title history [skip ci]"
          git push origin HEAD:main

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: number-pair-videos-${{ github.run_number }}
          path: private-source/dist/
          if-no-files-found: error
